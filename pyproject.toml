[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-tracker-api"
version = "2.1.0"
description = "Async Python client for Energy Tracker API"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Stefan Nebel"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "twine>=6.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0.0",
    "black>=26.0.0",
    "isort>=7.0.0",
    "mypy>=1.14.0",
    "packaging>=24.0",
    "jsonschema>=4.23.0",
]

[project.urls]
Homepage = "https://github.com/energy-tracker/api-client-python"
Documentation = "https://github.com/energy-tracker/api-client-python#readme"
Repository = "https://github.com/energy-tracker/api-client-python"

[tool.setuptools.packages.find]
include = ["energy_tracker_api", "energy_tracker_api.*"]

[tool.setuptools.package-data]
energy_tracker_api = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
